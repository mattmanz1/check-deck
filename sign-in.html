
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="images/study-buddy-favicon.png">
    <link rel="stylesheet" href="styles/sign-in.css">

    <title>Study Buddy | Sign In</title>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <section class="auth-container">

            <h1>Study Buddy</h1>
            <p>Your little companion to big achievements!</p>

            <!-- Buttons to switch between forms -->
            <div class="auth-tabs">
                <button id="login-tab" type="button" class="active" aria-pressed="true">Log In</button>
                <button id="signup-tab" type="button" aria-pressed="false">Sign Up</button>
            </div>

            <h2 id="form-title">Welcome Back!</h2>

            <!-- Login and signup form -->
            <form id="auth-form">

                <!-- Display name for new accounts -->
                <div id="name-field" hidden>
                    <label for="display-name">Display Name:</label>
                    <input type="text" id="display-name" name="displayName" autocomplete="name" minlength="1">
                </div>

                <!-- Email -->
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <!-- Password -->
                <div>
                    <label for="password">Password:</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="current-password" required minlength="6">
                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password" aria-pressed="false" title="Show password">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                                <path class="eye-slash" d="m4 4 16 16"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm password for signup -->
                <div id="confirm-field" hidden>
                    <label for="confirm-password">Confirm Password:</label>
                    <div class="password-field">
                        <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Show password" aria-pressed="false" title="Show password">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                                <path class="eye-slash" d="m4 4 16 16"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit form -->
                <button type="submit" id="submit-btn">Log In</button>

                <p id="auth-message" role="status" aria-live="polite"></p>

            </form>

        </section>
    </main>

    <script type="module" src="scripts/auth.js"></script>

</body>
</html>
