<!DOCTYPE html>
<html lang="en" class="auth-pending">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/study-buddy-favicon.png">
    <link rel="stylesheet" href="styles/account.css">
    <script type="module" src="scripts/auth-guard.js"></script>
    <title>Study Buddy | Account</title>
  </head>
  <body>
    <header class="account-header">
      <a class="back-link" href="main.html">&larr; Back to Study Buddy</a>
      <button id="sign-out" class="button button-secondary" type="button">Sign Out</button>
    </header>

    <main class="account-layout">
      <div class="page-heading">
        <p class="eyebrow">STUDY BUDDY</p>
        <h1>Account settings</h1>
        <p class="account-email" id="account-email"></p>
      </div>

      <section class="settings-section" aria-labelledby="name-heading">
        <h2 id="name-heading">Display name</h2>
        <p>This name appears in your welcome message.</p>
        <form id="name-form" class="settings-form">
          <label for="display-name">Name</label>
          <input id="display-name" name="displayName" type="text" maxlength="60" autocomplete="nickname" required>
          <button class="button button-primary" type="submit">Save name</button>
          <p class="form-message" id="name-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="settings-section" aria-labelledby="password-heading">
        <h2 id="password-heading">Change password</h2>
        <p>Confirm your current password before choosing a new one.</p>
        <form id="password-form" class="settings-form">
          <label for="current-password">Current password</label>
          <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
          <label for="new-password">New password</label>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="6" required>
          <label for="confirm-new-password">Confirm new password</label>
          <input id="confirm-new-password" name="confirmNewPassword" type="password" autocomplete="new-password" minlength="6" required>
          <button class="button button-primary" type="submit">Update password</button>
          <p class="form-message" id="password-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="settings-section danger-section" aria-labelledby="delete-heading">
        <h2 id="delete-heading">Delete account</h2>
        <p>Deleting your account is permanent. Enter your password and type DELETE to continue.</p>
        <form id="delete-form" class="settings-form">
          <label for="delete-password">Current password</label>
          <input id="delete-password" name="deletePassword" type="password" autocomplete="current-password" required>
          <label for="delete-confirmation">Type DELETE to confirm</label>
          <input id="delete-confirmation" name="confirmation" type="text" autocomplete="off" required>
          <button class="button button-danger" type="submit">Delete account</button>
          <p class="form-message" id="delete-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script type="module" src="scripts/account.js"></script>
  </body>
</html>
